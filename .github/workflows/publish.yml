name: Publish to PyPI

# vX.Y.Z 태그 push 또는 수동 실행으로 PyPI 로 배포합니다.
# PyPI Trusted Publishing(OIDC) 사용 — API 토큰 불필요.
# 태그와 Release를 함께 게시해도 중복 배포되지 않도록 태그만 자동 트리거합니다.
on:
  workflow_dispatch:        # 수동 실행(Actions 탭 또는 gh workflow run)
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi          # PyPI Trusted Publisher 폼의 Environment 와 동일하게(권장). 비워두면 폼도 비워두세요.
    permissions:
      id-token: write          # OIDC 토큰 발급(Trusted Publishing 필수)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 빌드 (sdist + wheel)
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: PyPI 배포
        uses: pypa/gh-action-pypi-publish@release/v1
